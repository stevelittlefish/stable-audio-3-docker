# Build and publish the Docker image to GHCR on a version tag.
#
# Same pattern as stevelittlefish/stem-separator (the other ASS backend): no
# binary step (this is Python), just build the existing Dockerfile and push it
# with the tag scheme GoReleaser produces elsewhere — exact vX.Y.Z, rolling
# vX.Y and vX, and latest.
#
# Cut a release with ./make_release.sh vX.Y.Z "message" — that tags and pushes,
# which fires this workflow. Nothing to run by hand here.
#
# Note: this image is big (CUDA devel + torch + flash-attn), so the first build
# is slow. The GHA layer cache keeps subsequent rebuilds cheap. Weights are NOT
# baked in — they're pulled at runtime into the shared /cache — so no Hugging
# Face token is needed at build time.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write # push to GHCR under this repo's owner

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The CUDA/torch/flash-attn layers are huge; free up runner disk so the
      # build doesn't fall over on a full filesystem.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup
          sudo docker image prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/stevelittlefish/stable-audio-3-docker
          # v1.2.3, v1.2, v1, latest. {{raw}} keeps the leading v so the exact
          # tag matches the git tag verbatim.
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=stable-audio-3
            org.opencontainers.image.description=Stable Audio 3 generation service (ASS backend)
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA layer cache so rebuilds of the heavy CUDA/torch/flash-attn layers
          # are cheap.
          cache-from: type=gha
          cache-to: type=gha,mode=max
