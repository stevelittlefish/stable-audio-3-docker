services:
  stable-audio-3:
    container_name: stable-audio-3-medium
    build:
      context: .
      dockerfile: Dockerfile
    image: stable-audio-3-medium:local
    restart: unless-stopped
    ports:
      - "5335:5335"
    environment:
      HF_TOKEN: "${HF_TOKEN:?Set HF_TOKEN to a Hugging Face token with access to stabilityai/stable-audio-3-medium}"
      HF_HOME: /cache/huggingface
      HF_XET_HIGH_PERFORMANCE: "1"
    volumes:
      - /srv/stable-audio-3/huggingface:/cache/huggingface
      - /srv/stable-audio-3/outputs:/app/outputs
      # Finetune LoRAs, read-only. Stage keepers here (e.g. copy from
      # /srv/underfit/state/runs/<run>/step=*.safetensors) with clean names.
      - /srv/stable-audio-3/loras:/loras:ro
    # Override the Dockerfile CMD to load LoRAs at startup. `command` replaces
    # CMD entirely, so --model medium is repeated here. Load ORDER sets each
    # LoRA's index used in the /v1/generate `loras` array (first = index 0).
    command:
      - /app/.venv/bin/python
      - /app/run_api.py
      - --model
      - medium
      - --lora-ckpt-path
      - /loras/limp-bizkit-4k.safetensors      # index 0
      # - /loras/another-style.safetensors     # index 1 (uncomment to add more)
    gpus:
      - driver: nvidia
        device_ids:
          - "0"
        capabilities:
          - gpu
    shm_size: 8gb
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5335/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20m
