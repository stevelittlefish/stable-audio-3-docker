services:
  stable-audio-3:
    container_name: stable-audio-3-medium
    build:
      context: .
      dockerfile: Dockerfile
    image: stable-audio-3-medium:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      HF_TOKEN: "${HF_TOKEN:?Set HF_TOKEN to a Hugging Face token with access to stabilityai/stable-audio-3-medium}"
      HF_HOME: /cache/huggingface
    volumes:
      - /srv/stable-audio-3/huggingface:/cache/huggingface
      - ./outputs:/app/outputs
    gpus:
      - driver: nvidia
        device_ids:
          - "1"
        capabilities:
          - gpu
    shm_size: 8gb
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20m
